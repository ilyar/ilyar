<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signature</title>
  <link rel="stylesheet" href="./signature.css">
  <style>
    :root { color-scheme: light dark; --font: "JetBrains Mono", monospace; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: light-dark(#292823, #edece6);
      background: light-dark(#faf9f6, #1c1d1c);
      font: 16px/1.5 var(--font);
    }
    main { max-width: 64rem; margin: auto; padding: clamp(24px, 6vw, 80px) 24px; }
    h1 { margin: 0 0 32px; font: 400 clamp(32px, 5vw, 56px)/1.1 var(--font); }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; }
    h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
    figure { margin: 0; padding-block-start: 8px; border-block-start: 1px solid color-mix(in srgb, currentColor 24%, transparent); }
    figcaption { font: 12px/16px var(--font); }
    @media (min-width: 56.01rem) {
      .gallery section { display: grid; grid-row: span 4; grid-template-rows: subgrid; row-gap: 0; }
    }
    @media (max-width: 56rem) {
      .gallery { grid-template-columns: 1fr; gap: 20px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Signature</h1>
    <!-- Integration: find the figure by variant and size (for example #colophon-36).
         Copy its complete footer and the files signature.css and ilyar.svg into the host project.
         Link signature.css after the site styles and resolve the image src to the copied SVG.
         Change the anchor href to the requested destination. Keep footer alignment, spacing,
         colors and typography. Compare the rendered footer with this example after fonts load. -->
    <div class="gallery">
      <section>
        <h2>Inline</h2>
        <figure id="inline-20">
          <figcaption>20 px</figcaption>
          <footer class="ilyar-footer">
            <a style="--ilyar-size: 20px" class="ilyar-signature ilyar-inline" href="https://github.com/ilyar">
              <span>made by</span>
              <img src="./ilyar.svg" width="20" height="20" alt="">
              <span class="ilyar-name">ilyar</span>
            </a>
          </footer>
        </figure>
        <figure id="inline-28">
          <figcaption>28 px · pick</figcaption>
          <footer class="ilyar-footer">
            <a style="--ilyar-size: 28px" class="ilyar-signature ilyar-inline" href="https://github.com/ilyar">
              <span>made by</span>
              <img src="./ilyar.svg" width="28" height="28" alt="">
              <span class="ilyar-name">ilyar</span>
            </a>
          </footer>
        </figure>
        <figure id="inline-36">
          <figcaption>36 px</figcaption>
          <footer class="ilyar-footer">
            <a style="--ilyar-size: 36px" class="ilyar-signature ilyar-inline" href="https://github.com/ilyar">
              <span>made by</span>
              <img src="./ilyar.svg" width="36" height="36" alt="">
              <span class="ilyar-name">ilyar</span>
            </a>
          </footer>
        </figure>
      </section>
      <section>
        <h2>Colophon</h2>
        <figure id="colophon-36">
          <figcaption>36 px</figcaption>
          <footer class="ilyar-footer">
            <a style="--ilyar-size: 36px" class="ilyar-signature ilyar-colophon" href="https://github.com/ilyar">
              <span class="ilyar-text"><span class="ilyar-credit">made by</span><span class="ilyar-name">ilyar</span></span>
              <img src="./ilyar.svg" width="36" height="36" alt="">
            </a>
          </footer>
        </figure>
        <figure id="colophon-48">
          <figcaption>48 px · pick</figcaption>
          <footer class="ilyar-footer">
            <a style="--ilyar-size: 48px" class="ilyar-signature ilyar-colophon" href="https://github.com/ilyar">
              <span class="ilyar-text"><span class="ilyar-credit">made by</span><span class="ilyar-name">ilyar</span></span>
              <img src="./ilyar.svg" width="48" height="48" alt="">
            </a>
          </footer>
        </figure>
        <figure id="colophon-60">
          <figcaption>60 px</figcaption>
          <footer class="ilyar-footer">
            <a style="--ilyar-size: 60px" class="ilyar-signature ilyar-colophon" href="https://github.com/ilyar">
              <span class="ilyar-text"><span class="ilyar-credit">made by</span><span class="ilyar-name">ilyar</span></span>
              <img src="./ilyar.svg" width="60" height="60" alt="">
            </a>
          </footer>
        </figure>
      </section>
      <section>
        <h2>Seal</h2>
        <figure id="seal-32">
          <figcaption>32 px</figcaption>
          <footer class="ilyar-footer ilyar-footer-end">
            <a style="--ilyar-size: 32px" class="ilyar-signature ilyar-seal" href="https://github.com/ilyar" aria-label="ilyar on GitHub">
              <img src="./ilyar.svg" width="32" height="32" alt="">
            </a>
          </footer>
        </figure>
        <figure id="seal-48">
          <figcaption>48 px · pick</figcaption>
          <footer class="ilyar-footer ilyar-footer-end">
            <a style="--ilyar-size: 48px" class="ilyar-signature ilyar-seal" href="https://github.com/ilyar" aria-label="ilyar on GitHub">
              <img src="./ilyar.svg" width="48" height="48" alt="">
            </a>
          </footer>
        </figure>
        <figure id="seal-80">
          <figcaption>80 px</figcaption>
          <footer class="ilyar-footer ilyar-footer-end">
            <a style="--ilyar-size: 80px" class="ilyar-signature ilyar-seal" href="https://github.com/ilyar" aria-label="ilyar on GitHub">
              <img src="./ilyar.svg" width="80" height="80" alt="">
            </a>
          </footer>
        </figure>
      </section>
    </div>
  </main>
</body>
</html>
