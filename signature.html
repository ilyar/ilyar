<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signature</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&amp;display=swap">
  <style>
    :root { color-scheme: light dark; --font: "JetBrains Mono", monospace; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: light-dark(#292823, #edece6);
      background: light-dark(#faf9f6, #1c1d1c);
      font: 16px/1.5 var(--font);
    }
    main { max-width: 64rem; margin: auto; padding: clamp(24px, 6vw, 80px) 24px; }
    h1 { margin: 0 0 32px; font: 400 clamp(32px, 5vw, 56px)/1.1 var(--font); }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; }
    h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
    figure { margin: 0; padding-block-start: 8px; border-block-start: 1px solid color-mix(in srgb, currentColor 24%, transparent); }
    figcaption { font: 12px/16px var(--font); }
    footer {
      display: flex;
      align-items: center;
      min-height: 96px;
    }
    .signature {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      color: inherit;
      text-decoration: none;
    }
    .signature:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    .signature:is(:hover, :focus-visible) .name { text-decoration: underline; text-underline-offset: 4px; }
    .signature img { display: block; border-radius: 50%; }
    .inline { font-size: max(14px, calc(var(--size) / 2)); }
    .inline .name { font-weight: 600; }
    .imprint { gap: 12px; }
    .imprint .text { display: grid; text-align: end; border-inline-end: 1px solid currentColor; padding-inline-end: 12px; }
    .imprint .credit { font: 14px/16px var(--font); }
    .imprint .name { font: calc(var(--size) - 16px)/1 var(--font); }
    .seal-footer { justify-content: flex-end; }
    .seal { min-width: 44px; justify-content: center; }
    @media (min-width: 56.01rem) {
      .gallery section { display: grid; grid-row: span 4; grid-template-rows: subgrid; row-gap: 0; }
    }
    @media (max-width: 56rem) {
      .gallery { grid-template-columns: 1fr; gap: 20px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Signature</h1>
    <div class="gallery">
      <section>
        <h2>Inline</h2>
        <figure>
          <figcaption>20 px</figcaption>
          <footer>
            <a style="--size: 20px" class="signature inline" href="https://github.com/ilyar">
              <span>made by</span>
              <img src="./ilyar.svg" width="20" height="20" alt="">
              <span class="name">ilyar</span>
            </a>
          </footer>
        </figure>
        <figure>
          <figcaption>28 px · pick</figcaption>
          <footer>
            <a style="--size: 28px" class="signature inline" href="https://github.com/ilyar">
              <span>made by</span>
              <img src="./ilyar.svg" width="28" height="28" alt="">
              <span class="name">ilyar</span>
            </a>
          </footer>
        </figure>
        <figure>
          <figcaption>36 px</figcaption>
          <footer>
            <a style="--size: 36px" class="signature inline" href="https://github.com/ilyar">
              <span>made by</span>
              <img src="./ilyar.svg" width="36" height="36" alt="">
              <span class="name">ilyar</span>
            </a>
          </footer>
        </figure>
      </section>
      <section>
        <h2>Colophon</h2>
        <figure>
          <figcaption>36 px</figcaption>
          <footer>
            <a style="--size: 36px" class="signature imprint" href="https://github.com/ilyar">
              <span class="text"><span class="credit">made by</span><span class="name">ilyar</span></span>
              <img src="./ilyar.svg" width="36" height="36" alt="">
            </a>
          </footer>
        </figure>
        <figure>
          <figcaption>48 px · pick</figcaption>
          <footer>
            <a style="--size: 48px" class="signature imprint" href="https://github.com/ilyar">
              <span class="text"><span class="credit">made by</span><span class="name">ilyar</span></span>
              <img src="./ilyar.svg" width="48" height="48" alt="">
            </a>
          </footer>
        </figure>
        <figure>
          <figcaption>60 px</figcaption>
          <footer>
            <a style="--size: 60px" class="signature imprint" href="https://github.com/ilyar">
              <span class="text"><span class="credit">made by</span><span class="name">ilyar</span></span>
              <img src="./ilyar.svg" width="60" height="60" alt="">
            </a>
          </footer>
        </figure>
      </section>
      <section>
        <h2>Seal</h2>
        <figure>
          <figcaption>32 px</figcaption>
          <footer class="seal-footer">
            <a style="--size: 32px" class="signature seal" href="https://github.com/ilyar" aria-label="ilyar on GitHub">
              <img src="./ilyar.svg" width="32" height="32" alt="">
            </a>
          </footer>
        </figure>
        <figure>
          <figcaption>48 px · pick</figcaption>
          <footer class="seal-footer">
            <a style="--size: 48px" class="signature seal" href="https://github.com/ilyar" aria-label="ilyar on GitHub">
              <img src="./ilyar.svg" width="48" height="48" alt="">
            </a>
          </footer>
        </figure>
        <figure>
          <figcaption>80 px</figcaption>
          <footer class="seal-footer">
            <a style="--size: 80px" class="signature seal" href="https://github.com/ilyar" aria-label="ilyar on GitHub">
              <img src="./ilyar.svg" width="80" height="80" alt="">
            </a>
          </footer>
        </figure>
      </section>
    </div>
  </main>
</body>
</html>
